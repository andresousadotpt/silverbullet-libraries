<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Spreadsheet</title><!-- STYLE --></head>
<body>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true">▦</span><div><h1 id="filename">Spreadsheet</h1><p id="subtitle">Open a workbook from your space</p></div></div>
    <div class="actions"><button id="enable" disabled>Enable editing</button><button id="editor-undo" disabled title="Undo (Ctrl/Cmd-Z)">Undo</button><button id="editor-redo" disabled title="Redo (Ctrl/Cmd-Shift-Z)">Redo</button><button id="save" disabled>Save</button><button id="download" disabled>Download</button></div>
  </header>
  <div id="notice" role="status">Loading spreadsheet editor…</div>
  <main id="viewport" tabindex="0" aria-label="Spreadsheet grid"></main>
  <div class="bottom"><output id="value" aria-label="Selected cell display"></output><span id="status" role="status" aria-live="polite">Ready</span></div>
  <!-- SCRIPT -->
</body>
</html>
